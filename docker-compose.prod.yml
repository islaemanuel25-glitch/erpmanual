services:
  db:
    image: postgres:16
    container_name: erpazul_db
    environment:
      POSTGRES_USER: erpazul
      POSTGRES_PASSWORD: erpazul
      POSTGRES_DB: erpazul
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpazul_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://erpazul:erpazul@db:5432/erpazul
      NODE_ENV: production
    depends_on:
      - db
