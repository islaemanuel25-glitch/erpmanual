services:
  db:
    image: postgres:16
    container_name: erpazul_db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: erpazul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erpazul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpazul -d erpazul"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # === CAMINO NORMAL: imagen ya construida en GHCR, identificada por SHA ===
    #
    # `APP_IMAGE` la define quien despliega, NUNCA se fija acá:
    #   APP_IMAGE=ghcr.io/islaemanuel25-glitch/erpmanual:<SHA_COMPLETO>
    #
    # Sin `latest` a propósito: una etiqueta móvil no permite saber qué versión
    # está corriendo ni volver a una anterior.
    #
    # El default `erpazul-app` es el CAMINO DE EMERGENCIA: es el mismo nombre que
    # produce el build local de siempre. Sin APP_IMAGE, `build` + `up` se comportan
    # exactamente como hasta hoy, así que el VPS nunca queda sin forma de levantar.
    image: ${APP_IMAGE:-erpazul-app}
    # `up` DESCARGA, NO CONSTRUYE.
    #
    # Este renglón es lo único que impide que un `docker compose up -d` distraído
    # dispare un build de 20 minutos en el VPS. Cuando un servicio declara `build`,
    # el default de Compose pasa a ser construir la imagen si no está presente;
    # con `missing` solo la busca en el cache local y, si no está, la baja del
    # registry. Si no puede bajarla, falla — que es lo correcto: mejor un error
    # claro que una compilación silenciosa encima de producción.
    pull_policy: missing
    # === CAMINO DE EMERGENCIA: build local ===
    #
    # Se conserva a propósito. Solo se activa con `docker compose build app`
    # EXPLÍCITO; `up` ya no lo alcanza gracias a pull_policy. Sirve si GitHub
    # Actions o GHCR no están disponibles y hay que desplegar igual.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # SHA del commit desplegado. Debe pasarse en el build:
        #   APP_BUILD_ID="$(git rev-parse HEAD)" \
        #     docker compose -f docker-compose.prod.yml build app
        # Se deja con default vacío para que `up`, `ps` y `logs` sigan
        # funcionando sin la variable; quien exige el valor es el Dockerfile,
        # vía REQUIRE_BUILD_ID, y solo durante el build.
        APP_BUILD_ID: "${APP_BUILD_ID:-}"
        REQUIRE_BUILD_ID: "1"
    container_name: erpazul_app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # La ruta del volumen de comprobantes. Sale de la MISMA variable que el
      # montaje de abajo, con el mismo default, para que no puedan desfasarse:
      # si la aplicación mirara una ruta y Docker montara otra, el chequeo del
      # arranque diría "no existe el directorio" y nadie sabría por qué.
      COMPROBANTES_VOLUMEN_PATH: "${COMPROBANTES_VOLUMEN_PATH:-/vol/comprobantes}"
      # Y el de fotos de PRODUCTO, que es otro volumen y no una carpeta adentro
      # del anterior. El motivo es la retención: los comprobantes se borran a los
      # siete días por diseño, y una foto de producto tiene que durar para
      # siempre. Compartir el volumen la pondría en ese reloj.
      FOTOS_PRODUCTOS_VOLUMEN_PATH: "${FOTOS_PRODUCTOS_VOLUMEN_PATH:-/vol/fotos-productos}"
    volumes:
      - ./backups:/app/backups
      - erpazul_comprobantes:${COMPROBANTES_VOLUMEN_PATH:-/vol/comprobantes}
      - erpazul_fotos_productos:${FOTOS_PRODUCTOS_VOLUMEN_PATH:-/vol/fotos-productos}
    depends_on:
      db:
        condition: service_healthy

# ── EL VOLUMEN DE FOTOS DE COMPROBANTES ─────────────────────────────────────
#
# `external: true` NO es opcional. Sin eso, Compose crea un volumen propio y le
# antepone el nombre del proyecto: quedaría `erpazul_erpazul_comprobantes`,
# vacío, y el que aprovisionamos a mano —con su centinela adentro— no se
# montaría nunca. La aplicación se negaría a escribir por falta de centinela, que
# es el final bueno, pero por un motivo que costaría entender.
#
# Se crea con el runbook, no con Compose: docs/RUNBOOK-VOLUMEN-COMPROBANTES.md.
# NO va al backup, a propósito: docs/decisions/DEC-0008.
volumes:
  erpazul_comprobantes:
    external: true

  # ── EL VOLUMEN DE FOTOS DE PRODUCTO ───────────────────────────────────────
  #
  # Mismo `external: true` y por el mismo motivo que el de arriba: sin eso
  # Compose crea uno propio con el nombre del proyecto adelante, vacío, y el que
  # se aprovisionó a mano —con su centinela `.volumen-fotos-productos` adentro—
  # no se monta nunca.
  #
  # ES UN VOLUMEN APARTE Y NO UNA CARPETA DEL ANTERIOR, y la diferencia es la
  # retención: los comprobantes se borran a los siete días por diseño y estas
  # fotos NO SE BORRAN NUNCA. Compartir el volumen las pondría en ese reloj — la
  # foto andaría una semana y después la tarjeta mostraría un cuadrado roto, sin
  # ningún error y sin que nadie relacione una cosa con la otra.
  #
  # Se crea con docs/RUNBOOK-VOLUMEN-FOTOS-PRODUCTOS.md, no con Compose.
  #
  # A DIFERENCIA DEL DE COMPROBANTES, ÉSTE SÍ TENDRÍA QUE IR AL BACKUP: aquéllas
  # son copias de papeles que se tiran a la semana, y éstas son parte del
  # catálogo. Todavía no está hecho — queda anotado en el runbook.
  erpazul_fotos_productos:
    external: true
