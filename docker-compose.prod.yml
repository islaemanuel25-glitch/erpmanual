services:
  db:
    image: postgres:16
    container_name: erpazul_db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: erpazul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erpazul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpazul -d erpazul"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # SHA del commit desplegado. Debe pasarse en el build:
        #   APP_BUILD_ID="$(git rev-parse HEAD)" \
        #     docker compose -f docker-compose.prod.yml build app
        # Se deja con default vacío para que `up`, `ps` y `logs` sigan
        # funcionando sin la variable; quien exige el valor es el Dockerfile,
        # vía REQUIRE_BUILD_ID, y solo durante el build.
        APP_BUILD_ID: "${APP_BUILD_ID:-}"
        REQUIRE_BUILD_ID: "1"
    container_name: erpazul_app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
