# Verificación de una rama: candados, esquema y migraciones contra un PostgreSQL
# EFÍMERO que vive y muere dentro del runner.
#
# ── POR QUÉ EXISTE ──────────────────────────────────────────────────────────
#
# CLAUDE.md dice, con su caso de origen al lado, que una consulta de Prisma no la
# prueba ni el build ni los candados: hay que ejercerla contra Postgres. El
# 2026-08-12 tres rutas pedían una relación que no existe, el build compiló, los
# 3.071 candados quedaron en verde y la pantalla de comprobantes se cayó en
# producción.
#
# Hasta hoy no había dónde correr eso. La única base a mano era la de producción,
# y contra ésa no se prueba nada. Este workflow levanta una base descartable en
# el runner de GitHub, aplica las 107 migraciones desde cero y corre las pruebas
# ahí. Al terminar el job, el contenedor se destruye con el runner: no hay nada
# que limpiar ni nada que se pueda quedar prendido.
#
# ── LO QUE NO TIENE, Y ES A PROPÓSITO ───────────────────────────────────────
#
# NO usa ningún secreto. La `DATABASE_URL` apunta al service container y está
# escrita en claro acá abajo porque no protege nada: es una base vacía que dura
# tres minutos dentro de una máquina que se apaga. Un secreto de producción en un
# workflow que corre en cada push a cada rama es exactamente el agujero que este
# archivo no puede abrir.
#
# NO despliega, NO publica imagen y NO toca el VPS. Eso es `build-imagen.yml`,
# que corre solo en `main`. Éste corre en las ramas de trabajo y lo único que
# produce es un veredicto.

name: Verificación (candados + base efímera)

on:
  push:
    # En `main` ya corre `build-imagen.yml`. Acá interesan las ramas de trabajo,
    # que es donde el error todavía se puede arreglar barato.
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Una corrida por rama: un push encima de otro cancela la anterior, que ya no
  # informa sobre nada que exista.
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # La MISMA versión mayor que corre en producción (postgres:16). Probar
        # contra otra convertiría un verde acá en una promesa que la base real no
        # necesariamente cumple.
        image: postgres:16
        env:
          POSTGRES_USER: erpazul
          POSTGRES_PASSWORD: erpazul_ci
          POSTGRES_DB: erpazul_ci
        ports:
          - 5432:5432
        # Sin el health check, los pasos arrancan antes de que Postgres acepte
        # conexiones y fallan por una carrera en vez de por el código.
        options: >-
          --health-cmd "pg_isready -U erpazul -d erpazul_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Host local por partida doble: es lo que el runner expone, y es lo que
      # `scripts/lib/clientePrisma.mjs` exige para el nivel ESCRITURA. Un script
      # de datos apuntando a un host remoto aborta con código 2, y así queremos
      # que siga siendo.
      DATABASE_URL: postgresql://erpazul:erpazul_ci@127.0.0.1:5432/erpazul_ci
      # Base aparte para la sombra de `migrate diff`: comparar el historial de
      # migraciones contra el schema necesita una base propia que Prisma crea y
      # destruye.
      SHADOW_DATABASE_URL: postgresql://erpazul:erpazul_ci@127.0.0.1:5432/erpazul_ci_shadow
      # NO es production, y el candado de la fábrica lo comprueba: con
      # NODE_ENV=production el nivel ESCRITURA aborta.
      NODE_ENV: test
      # Las rutas verifican la sesión con un JWT firmado. Este valor NO es un
      # secreto de nada: firma cookies de una base que dura tres minutos. Ponerlo
      # en `secrets` daría la falsa impresión de que protege algo real.
      AUTH_SECRET: secreto-de-ci-sin-valor-fuera-del-runner

    steps:
      - name: Traer el código de ESTA rama
        uses: actions/checkout@v4

      - name: Node 20 (el mismo del Dockerfile)
        uses: actions/setup-node@v4
        with:
          # El Dockerfile construye con node:20-alpine. Y hay un motivo más
          # concreto: los módulos de `lib/` son ESM escritos en archivos `.js` y
          # el `package.json` no declara `"type": "module"`, así que la suite
          # depende de que Node detecte el módulo solo. Eso está disponible desde
          # 20.19; en Node 18 la suite entera falla al instanciar, diciendo que
          # un módulo "no exporta" algo que sí exporta.
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # ── PRISMA: generar, validar, aplicar ──────────────────────────────────
      #
      # `generate` va PRIMERO y no es ceremonia: CLAUDE.md tiene una regla entera
      # sobre esto. El cliente se genera aparte de la migración, y un cliente
      # viejo pasa el build y pasa los candados —son funciones puras que no tocan
      # la base— y recién falla contra Postgres, con un mensaje que apunta a otro
      # lado.
      - name: prisma generate
        run: npx prisma generate

      - name: prisma validate
        run: npx prisma validate

      # ── LOS CANDADOS VAN ANTES DE LA BASE ──────────────────────────────────
      #
      # No es cosmético. Un paso que falla corta el job, así que con la suite
      # detrás de las migraciones un problema del historial de migraciones deja
      # sin ejecutar los 3.000 candados y la corrida no informa sobre ellos. Los
      # candados son funciones puras: no tocan Postgres y no tienen por qué
      # esperar a que la base esté armada.
      #
      # Se descubrió en la primera corrida real: `migrate deploy` se cayó en la
      # segunda migración y no se supo nada del resto.
      - name: Suite de candados
        run: npm test

      # Un candado que nunca se vio en rojo se lee igual que uno que funciona.
      # Esto rompe a propósito, uno por uno, los doce defectos que la revisión
      # arquitectónica del 2026-09-08 encontró con la suite en verde, y exige
      # que el candado que cubre cada uno se ponga rojo POR SU NOMBRE.
      #
      # Corre sobre copias descartables: no toca el árbol. Y verifica que la
      # inyección aplicó y que el módulo siguió cargando, porque un ancla que no
      # engancha y un archivo que no parsea son las dos formas de que una
      # contraprueba mienta.
      #
      # La hermana que necesita Postgres —desmarcar y el ajuste al origen— vive
      # en scripts/pruebas-db/contrapruebasRevision.mjs y se corre a mano: cada
      # caso corre la suite de recepción entera, y son minutos.
      - name: Contrapruebas de la revisión
        run: node scripts/contrapruebas-revision.mjs

      - name: Aplicar las migraciones DESDE CERO
        # El mismo comando que corre el despliegue, sobre una base vacía. Desde
        # el saneamiento del historial hay UNA sola migración —la baseline— y
        # esto tiene que quedar en verde: si vuelve a ponerse rojo, el historial
        # dejó de ser reproducible otra vez.
        #
        # NO se reemplaza por `db push` en ningún caso. `db push` construye una
        # base parecida por otro camino, y entonces el job diría que el camino
        # real anda cuando lo que anda es otro.
        run: npx prisma migrate deploy

      - name: Comprobar la estructura, con los 9 objetos escritos a mano
        # Lo que ningún candado puede ver: que la base construida tenga los ocho
        # índices parciales CON SU PREDICADO y el CHECK de combos, que son los
        # objetos que Prisma no sabe expresar y que viven en un bloque de SQL
        # manual al final de la baseline. Si alguien regenera la baseline y se
        # olvida de ese bloque, la base sale sin sus invariantes y todo lo demás
        # sigue en verde.
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/estructura.mjs

      - name: Comparar contra la estructura de producción
        # ── SOLO EN LA RAMA DEL SANEAMIENTO, Y A PROPÓSITO ──────────────────
        #
        # `docs/deploy/estructura-produccion/` es una FOTOGRAFÍA del 2026-09-04,
        # no un contrato. Sirvió para demostrar que la baseline reproduce lo que
        # producción tenía en el momento del squash.
        #
        # Exigirla en todas las ramas sería pedir que ninguna migración nueva
        # cambie nada hasta desplegarse, o sea convertir cada cambio de esquema
        # en un rojo. A la tercera vez nadie miraría el chequeo, y ahí se pierde
        # el que sí importa.
        #
        # Lo que sí se exige SIEMPRE, en todas las ramas, es la cadena de los
        # pasos de arriba y abajo: migraciones → base vacía → schema.prisma. Eso
        # no menciona a producción y no envejece.
        #
        # Ver el README de ese directorio.
        if: github.ref_name == 'chore/sanear-historial-migraciones'
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/comparar-con-produccion.mjs

      - name: El schema y las migraciones dicen lo mismo
        # Detecta la deriva: un cambio escrito en schema.prisma que nadie migró.
        # `--exit-code` devuelve 2 cuando hay diferencia, así el paso se pone en
        # rojo en vez de imprimir el diff y seguir en verde.
        run: |
          set -euo pipefail
          # Prisma NO crea la base sombra: la exige existente y aborta con P1003
          # si no está. `--if-not-exists` para que el paso sea repetible.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE erpazul_ci_shadow' \
            || echo "la sombra ya existía"

          # ── SE EXIGE DERIVA CERO, Y SE IMPRIME EL DIFF ───────────────────
          #
          # Se esperaba que el diff propusiera borrar los nueve objetos del
          # bloque manual de la baseline, porque `schema.prisma` no puede
          # declararlos. Se midió y NO es así: sale vacío. Prisma no ve los
          # índices parciales ni los CHECK en ninguno de los dos lados, así que
          # no los reporta.
          #
          # Por eso se puede exigir cero de verdad. Y por eso mismo este paso NO
          # protege esos nueve: de ésos se ocupa `estructura.mjs`, que los busca
          # en la base ya construida y compara sus predicados.
          #
          # Se imprime el diff aunque esté vacío: cuando algún día no lo esté, lo
          # primero que se quiere ver es qué propone.
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > /tmp/deriva.sql

          echo "── lo que migrate diff propone ────────────────────────────────"
          cat /tmp/deriva.sql
          echo "───────────────────────────────────────────────────────────────"

          node scripts/pruebas-db/revisar-deriva.mjs /tmp/deriva.sql

      # ── LAS PRUEBAS QUE NECESITAN BASE ─────────────────────────────────────
      #
      # Esto es lo que ningún candado puede hacer: ejercer las consultas contra
      # Postgres de verdad. Corre después de la suite a propósito —si una función
      # pura está rota, el error se lee mejor allá que acá.
      - name: Pruebas de base (ofertas y recargos)
        # Con el mismo cargador que usa la suite: el script importa handlers de
        # rutas, y esas rutas resuelven el alias `@/…` que Node no conoce.
        #
        # El `if` NO es para saltear un fallo: es porque este archivo vive en la
        # rama de Ofertas y en `main` todavía no existe. Saltearlo cuando no está
        # es lo correcto; saltearlo cuando está sería taparlo, y por eso la
        # condición mira el archivo y no el resultado.
        run: |
          set -euo pipefail
          if [ -f scripts/pruebas-db/ofertas.mjs ]; then
            node --import ./scripts/alias-loader.mjs scripts/pruebas-db/ofertas.mjs
          else
            echo "No hay scripts/pruebas-db/ofertas.mjs en esta rama: nada que correr."
          fi
          if [ -f scripts/pruebas-db/alertas.mjs ]; then
            echo ""
            node --import ./scripts/alias-loader.mjs scripts/pruebas-db/alertas.mjs
          else
            echo "No hay scripts/pruebas-db/alertas.mjs en esta rama: nada que correr."
          fi
          if [ -f scripts/pruebas-db/mediosCobro.mjs ]; then
            echo ""
            node --import ./scripts/alias-loader.mjs scripts/pruebas-db/mediosCobro.mjs
          else
            echo "No hay scripts/pruebas-db/mediosCobro.mjs en esta rama: nada que correr."
          fi
          if [ -f scripts/pruebas-db/modalidadesCobro.mjs ]; then
            echo ""
            node --import ./scripts/alias-loader.mjs scripts/pruebas-db/modalidadesCobro.mjs
          else
            echo "No hay scripts/pruebas-db/modalidadesCobro.mjs en esta rama: nada que correr."
          fi
          if [ -f scripts/pruebas-db/recepcionTransferencias.mjs ]; then
            echo ""
            node --import ./scripts/alias-loader.mjs scripts/pruebas-db/recepcionTransferencias.mjs
          else
            echo "No hay scripts/pruebas-db/recepcionTransferencias.mjs en esta rama: nada que correr."
          fi
          # Un `?destino=` en la URL no amplía el alcance de un local en el
          # tablero de Transferencias: el handler real, con sesiones firmadas.
          echo ""
          node --import ./scripts/alias-loader.mjs scripts/pruebas-db/transferenciasAlcance.mjs
          # Azul Chat · ventas_resumen: los mismos números que el reporte del
          # ERP, y la autorización contra filas reales. Base propia descartable.
          echo ""
          node --import ./scripts/alias-loader.mjs scripts/pruebas-db/azulChatVentasResumen.mjs
          # Azul Chat · transferencias_eventos: recepciones reales, el cursor,
          # el margen de 60 s y la autorización en vivo. Base propia descartable.
          echo ""
          node --import ./scripts/alias-loader.mjs scripts/pruebas-db/azulChatTransferenciasEventos.mjs

      # ── EL LIBRO DE STOCK ─────────────────────────────────────────────────
      #
      # Va DESPUÉS de las otras pruebas de base a propósito: esas escriben stock
      # con el libro ya instalado por `migrate deploy`, y el verificador que corre
      # al final de ésta mira también lo que dejaron. Si alguna escribiera
      # StockLocal por un camino que el trigger no ve, se pone rojo acá.
      #
      # Además arma bases descartables al lado —la activación sobre una base SIN
      # libro, la carrera, la contraprueba y un dump restaurado— y las borra.
      - name: Libro de stock (activación, carrera, captura, restore)
        run: |
          set -euo pipefail
          pg_dump --version
          node --import ./scripts/alias-loader.mjs scripts/pruebas-db/libroStock.mjs

      # ── EL STOCK DIARIO ───────────────────────────────────────────────────
      #
      # Apertura, movimientos y cierre derivados del libro: los casos del día con
      # su valor esperado, todas las cadenas y todos los días contra una fuerza
      # bruta, la misma respuesta con otra zona en la sesión y en Node, y el
      # EXPLAIN de un local entero con un millón de movimientos sintéticos —con
      # el índice nuevo y la contraprueba sin él—. Bases descartables, borradas
      # al terminar.
      - name: Stock Diario (semántica, fuerza bruta, zonas, plan con volumen)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/stockDiario.mjs

      # ── LA API DEL STOCK DIARIO ───────────────────────────────────────────
      #
      # Los handlers reales de `app/api/stock_locales/diario/` con sesiones
      # firmadas como las firma el login: quién ve qué ubicación —encargado,
      # cajero, depósito, admin en vista global dentro y fuera de su grupo—, los
      # estados del período con el reloj real de PostgreSQL, la paginación, los
      # filtros, los 400, y que ninguna llamada escriba una fila. Base
      # descartable, borrada al terminar.
      - name: API del Stock Diario (aislamiento, períodos, paginación, solo lectura)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/stockDiarioApi.mjs

      # ── EL VALOR DEL STOCK ────────────────────────────────────────────────
      #
      # Los dos libros juntos, con escrituras reales reubicadas en el tiempo: el
      # costo congelado a las 00:00, el pack y la pieza en unidades físicas, el
      # faltante que no es cero, el negativo, el tránsito con su costo congelado,
      # la identidad final − inicial = físico + revalorización, y las rutas con
      # stock.ver y sin él. Base descartable, borrada al terminar.
      - name: Valor del Stock (costo congelado, revalorización, tránsito, permisos)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/valorDelStock.mjs

      # ── LA RECUPERACIÓN DEL LIBRO ─────────────────────────────────────────
      #
      # El procedimiento del runbook de /deploy si la activación del libro no
      # consigue su candado: una base como producción, `migrate deploy` real con
      # una transacción reteniendo StockLocal, P3018/55P03, el diagnóstico, la
      # cadena `diagnóstico && resolve --rolled-back` y el reintento. Y las
      # contrapruebas: cada estado que no es el caso recuperable frena y la cadena
      # no resuelve. Bases descartables, borradas al terminar.
      - name: Recuperación del libro de stock (lock timeout → resolve --rolled-back)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/recuperacionLibroStock.mjs

      # ── EL LIBRO DE COSTOS ────────────────────────────────────────────────
      #
      # Inerte hasta la activación; la activación que no consigue su candado no
      # deja nada; el punto cero con su huella; la captura por Prisma, SQL
      # directo y la ruta real de eliminar producto; la historia que no se toca;
      # la escala que alcanza para `costoPorUnidadFisica`; y la activación por
      # migración con P3018/55P03, `resolve --rolled-back` y reintento. Bases
      # descartables, borradas al terminar.
      - name: Libro de costos (activación, captura, inmutabilidad, escala)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/libroCostos.mjs

      # El procedimiento del runbook de /deploy si la activación del Libro de
      # Costos no consigue su candado: una base como producción antes de
      # activar, `migrate deploy` real con una transacción reteniendo
      # ProductoBase, el diagnóstico de solo lectura, la cadena con la forma
      # exacta del comando que acepta la guardia, el reintento, y cada estado en
      # que el diagnóstico tiene que frenar sin resolver.
      - name: Recuperación de la activación del Libro de Costos (lock timeout → resolve --rolled-back)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/recuperacionLibroCostos.mjs

      # La migración de la caja por operador por el camino real de `migrate
      # deploy`, sobre bases como producción antes de ella: limpia aplica sin
      # tocar una fila; con el mismo operador en dos cajas aborta por su guardia;
      # con una sesión reteniendo Turno falla por el tope de 3 s. Y el precheck
      # de solo lectura en cada caso. Sin recuperación: una fallida frena.
      - name: Migración de la caja por operador (guardia, lock timeout y precheck)
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/migracionCajaPorOperador.mjs

      # ── LA PREGUNTA QUE DECIDE EL DESPLIEGUE ──────────────────────────────
      #
      # Producción conserva sus 105 migraciones viejas en `_prisma_migrations` y
      # el directorio activo ahora tiene una sola. ¿Qué hace `migrate deploy`
      # cuando la base tiene filas que ya no existen como archivo?
      #
      # Se contesta MIDIÉNDOLO acá, sobre una base descartable, en vez de
      # deducirlo de la documentación. Es lo que hay que saber antes de tocar
      # producción, y es barato: se siembran las filas viejas y se mira.
      #
      # Va ÚLTIMO a propósito: ensucia `_prisma_migrations` de la base efímera y
      # no tiene por qué influir en ningún paso anterior.
      - name: Simular el historial de producción y ver qué diría el despliegue
        run: |
          set -uo pipefail
          node --import ./scripts/alias-loader.mjs scripts/pruebas-db/simular-historial-produccion.mjs
          echo ""
          echo "── prisma migrate status ──────────────────────────────────────"
          npx prisma migrate status || true
          echo ""
          echo "── prisma migrate deploy ──────────────────────────────────────"
          npx prisma migrate deploy || true
          echo ""
          echo "Este paso NO decide el veredicto del job: es un informe para la"
          echo "tanda de despliegue. Por eso los comandos llevan '|| true'."

      # ── EL CONTRATO HACIA ADELANTE ────────────────────────────────────────
      #
      # Todo lo anterior comprueba el estado de HOY. Esto comprueba el de mañana:
      # que sobre el escenario real de producción —105 filas sin archivo más la
      # baseline aplicada— Prisma detecte una migración nueva como pendiente y
      # aplique SOLO ésa.
      #
      # Si se plantara por las filas sin archivo, o intentara reaplicar la
      # baseline sobre una base que ya tiene todo, el próximo despliegue del ERP
      # se caería. Conviene saberlo acá y no esa noche.
      #
      # Éste SÍ decide el veredicto: no lleva `|| true`.
      - name: Contraprueba — una migración posterior se aplica sola
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contraprueba-migracion-nueva.mjs

      - name: Resumen
        if: always()
        run: |
          # Las comillas invertidas van ESCAPADAS. Dentro de comillas dobles, una
          # comilla invertida sin escapar abre una sustitución de comando: bash
          # intenta EJECUTAR lo que hay adentro. Sin las barras, la línea de las
          # migraciones corría `prisma migrate deploy` de verdad —otra vez, y sin
          # npx— y las otras dos ejecutaban el nombre de la rama y la versión de
          # Node como si fueran comandos.
          {
            echo "### Verificación de \`${{ github.ref_name }}\`"
            echo ""
            echo "- Node: \`$(node -v)\`"
            echo "- Base: PostgreSQL 16 efímera del runner (destruida al terminar el job)"
            echo "- Migraciones aplicadas desde cero: \`prisma migrate deploy\`"
            echo ""
            echo "Sin secretos y sin contacto con producción."
          } >> "$GITHUB_STEP_SUMMARY"

  # Finanzas tiene su propio job porque la validación que importa acá es que los
  # handlers REALES lleguen a PostgreSQL. No depende de las contrapruebas
  # históricas de Recepción: si una de aquéllas tiene un ancla vieja, este job
  # igual debe decir si las consultas nuevas de Finanzas existen de verdad.
  finanzas_postgres:
    runs-on: ubuntu-latest
    # Las contrapruebas TV- y VA- copian el repo y corren su suite una vez cada una.
    timeout-minutes: 24

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erpazul
          POSTGRES_PASSWORD: erpazul_ci
          POSTGRES_DB: erpazul_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpazul -d erpazul_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://erpazul:erpazul_ci@127.0.0.1:5432/erpazul_ci
      NODE_ENV: test
      AUTH_SECRET: secreto-de-ci-sin-valor-fuera-del-runner

    steps:
      - name: Traer esta rama
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones desde cero
        run: npx prisma migrate deploy

      - name: Ejercer Finanzas contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/finanzas.mjs

      # El Pago a depósito: los dos handlers —el tablero de Finanzas y el de
      # Transferencias con `criterio=RECEPCION`— sobre las mismas transferencias,
      # con `Decimal` de verdad. Solo lo `Recibida` por `fechaRecepcion`, las
      # pendientes aparte, el Ver con su permiso, el mismo total en los dos
      # módulos y la cuenta por envío sin cambios.
      - name: Ejercer el Pago a depósito contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/pagoADeposito.mjs

      # Gastos: las dos puertas que escriben —crear y pagar— contra una base
      # descartable con todas las migraciones. La ubicación dueña, el efectivo
      # con su RETIRO vinculado, la idempotencia bajo carrera, la atomicidad del
      # pago inicial, los CHECK, y que Finanzas clasifique ese retiro por el
      # vínculo y no lo cuente como retiro manual.
      - name: Ejercer Gastos contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/gastos.mjs

      # Las rutas de Gastos, con sesiones firmadas como las del login: el alcance
      # por ubicación, los permisos, el listado filtrado y paginado en la base,
      # el mapeo de errores a HTTP, y que el cliente no elija la ubicación ni el
      # movimiento de caja.
      - name: Ejercer las rutas de Gastos contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/gastosApi.mjs

      # La semana operativa de la ubicación: el backfill de su migración —el mismo
      # SQL del archivo—, las restricciones que Prisma no ve, las dos rutas que la
      # escriben y la paridad de Transferencias. Va en este job porque es la base
      # de los períodos de Finanzas y no depende de las contrapruebas de Recepción.
      - name: Ejercer la semana operativa contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/semanaOperativa.mjs

      # Lo que una compra suma al stock al recibirla, congelado en la línea: se
      # compara, caso por caso, el delta real de `StockLocal` contra
      # `stockIngresado`. Va en este job porque es el dato que Finanzas va a
      # leer para la variación de stock.
      - name: Ejercer la recepción de compras contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/recepcionCompras.mjs

      # Y que esa prueba MIRA: se rompe el cierre sobre una copia, tres veces, y
      # cada vez tienen que gritar las afirmaciones que nombra el caso. Solo los
      # casos `SI-`: los de transferencias tardan minutos y se corren a mano.
      - name: Contrapruebas de la recepción de compras
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs SI-

      # El freno de costo del cierre, con un costo maestro real distinto de
      # cero: qué frena, qué acepta y qué queda escrito. Estuvo apagado desde
      # el 2026-08-11 porque el `select` no traía `precio_costo`, y ningún
      # candado lo veía: miraban funciones puras o el texto del fuente.
      - name: Ejercer el freno de costo de la recepción contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/frenoDeCosto.mjs

      - name: Contrapruebas del freno de costo
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs FC-

      # El origen de las escrituras de costo, para el futuro Libro de Costos: un
      # trigger de captura en una base descartable anota lo que cada transacción
      # declaró. Que se ve adentro y muere con el commit en la misma conexión,
      # que una declaración mala no frena la escritura, que declarar no cambia la
      # fila, y que el cierre de compra, la herencia del depósito y el envío de
      # una transferencia declaran lo suyo sin tocar costos ni el libro físico.
      # Y las bajas por sus handlers: eliminar producto y el reset operativo
      # declaran su origen en la misma transacción y borran lo mismo que sin él.
      - name: Ejercer el origen de las escrituras de costo contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/origenDeCosto.mjs

      # La función canónica de costo por unidad física contra el POS real: para
      # cada familia en la que el POS y la regla coinciden, el mismo costo por
      # unidad física en el depósito y en un local. Y la divergencia conocida
      # —kg + pieza + compra por bulto— escrita como afirmación.
      - name: Conformidad del costo por unidad física con el POS
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/costoPorUnidadFisica.mjs

      # El ajuste de stock del peso fijo por la ruta real: piezas enteras en el
      # depósito, kilos con decimales en el local, y media pieza rechazada sin
      # mover el stock ni dejar auditoría.
      - name: Ajuste de stock del peso fijo contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/ajusteStockPieza.mjs

      # La trazabilidad del Libro de Stock por las rutas reales: el ajuste
      # manual a nombre de su AuditoriaStock, la causa contra el stock real, la
      # venta concurrente que no se pierde —forzada con un bloqueo retenido—,
      # la declaración que no se filtra, la venta y su corrección, y las
      # transacciones mixtas con cada tramo a nombre de su documento.
      - name: Trazabilidad del Libro de Stock contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/ajusteStockTrazable.mjs

      # El ciclo de cierre de caja: la carrera entre el cierre clásico y el corte
      # —forzada con un lock retenido, no librada al azar—, la corrección de una
      # venta según el estado de su turno y el vencimiento de un corte por
      # `venceEn`. Va en este job porque una semana no se puede consolidar con un
      # turno sin resolver, y estos son los candados de ese ciclo.
      - name: Ejercer el ciclo de cierre de caja contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cierreCaja.mjs

      - name: Contrapruebas del ciclo de cierre de caja
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs CC-

      # La caja es del OPERADOR: mismo local, misma cuenta ERP, dos operadores y
      # dos cajas simultáneas. A −$5.000 y B +$5.000 tienen que llegar así hasta
      # la auditoría, sin compensarse. Y las contrapruebas: nadie vende, mueve,
      # arquea, retira, corta ni cierra la caja de otro; el Dueño interviene con
      # su autoría; un local sin operario sigue con la caja de la cuenta.
      - name: Caja por operador contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cajaPorOperador.mjs

      # Un mismo cobro, una sola venta: reintentos con el mismo clientTxnId,
      # reintentos simultáneos que chocan contra el índice único, un P2002 de
      # otra restricción que no se toma por reintento, y que la idempotencia no
      # abre la caja de otro operador.
      - name: Cobro idempotente contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cobroIdempotente.mjs

      # Un cobro offline registrado es evidencia, no una venta: registrarlo no
      # escribe nada económico; el mismo id no se apropia de otro local ni de
      # otro contenido; `crear` lo sincroniza en su transacción, lo reconcilia en
      # los duplicados y no convierte en venta uno descartado. Las carreras
      # contra el candado del local se fuerzan, no se esperan.
      - name: Cobros offline contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cobrosOffline.mjs

      # Una venta no entra en una caja que ya tomó el corte (R2c): `crear` vuelve
      # a mirar el turno adentro de su transacción, con el turno tomado. Las
      # carreras venta ↔ corte, venta ↔ cierre, dos ventas alrededor de la
      # frontera, el cobro offline y ventas + corte + retiro a la vez se fuerzan
      # contra los locks reales.
      - name: Venta contra corte de caja contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/carreraVentaCorte.mjs

      # El cierre directo (`turnos/cerrar`) congela lo que de verdad quedó en el
      # turno: calcula ventas, esperado y diferencia con el turno tomado, así que
      # la venta que gana entra en la fotografía y la que pierde no entra al turno.
      - name: Cierre directo atómico contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cierreDirectoAtomico.mjs

      # Un Caja +/− no entra en una caja que ya tomó el corte o se cerró: valida
      # y escribe con el turno tomado (bloquearTurno), en una sola transacción.
      # Las carreras movimiento ↔ corte, movimiento ↔ cierre directo, dos
      # movimientos alrededor del corte y los pedidos simultáneos se fuerzan
      # contra los locks reales; las contrapruebas sacan cada defensa.
      - name: Caja +/− contra corte y cierre contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/cajaMovimientoAtomico.mjs

      - name: Contrapruebas de Caja +/− contra corte y cierre
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs CM-

      # La lectura de Tesorería: el efectivo declarado sale solo de las entregas
      # (CajaMovimiento RECAUDACION/CIERRE por vínculo), una vez por id aunque el
      # mismo retiro esté copiado en Turno, ArqueoCaja y las preparaciones; un
      # pago en efectivo desde la caja no se resta otra vez; los pagos que no son
      # efectivo son egresos exteriores; el Caja +/− no tiene semántica; y un
      # cierre sin conteo no se lee como $0. Las cajas, ventas, retiros, cierres
      # y pagos se arman con las rutas y funciones reales.
      - name: Lectura de Tesorería contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/tesoreriaLectura.mjs

      - name: Contrapruebas de la lectura de Tesorería
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs TE-

      # La puerta de Tesorería (GET /api/finanzas/tesoreria): pide tesoreria.ver,
      # un local no lee a otro, el período es el de Finanzas, la respuesta es la
      # lectura canónica, la cantidad de consultas no crece con las cajas y un
      # GET no escribe nada.
      - name: API de Tesorería contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/tesoreriaApi.mjs

      - name: Contrapruebas de la API de Tesorería
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs TA-

      # La persistencia de la verificación de efectivo: lo que la BASE sostiene
      # sola —exclusividad de la entrega con carrera forzada, foto fiel e
      # inmutable, declarado = suma, un solo local, idempotencia por local,
      # anulación sin perder historia, nada se borra—. Las contrapruebas TV-
      # rompen el texto de la migración y lo aplican en una base aislada, copia
      # de ésta, que se tira al terminar.
      - name: Verificación de efectivo contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/verificacionEfectivo.mjs

      - name: Contrapruebas de la verificación de efectivo
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs TV-

      # Verificar y anular por las rutas: permisos separados, alcance por local,
      # declarado del servidor, idempotencia con huella, anulación segura, la
      # lectura con lo pendiente y lo verificado aparte, la alerta de
      # desactualizada, el candado de la corrección histórica y las cuatro
      # carreras forzadas sobre el turno.
      - name: Acciones de verificación de efectivo contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/verificacionEfectivoAcciones.mjs

      - name: Contrapruebas de las acciones de verificación
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs VA-

      # El contrato que lee la pantalla móvil (PR #138): «Otro» mal armado es 400
      # y no otro período, los pagos se nombran con datos reales, las
      # capacidades salen del permiso, el operador no se completa con la cuenta
      # y un acto que cruza el período no se da por completo. Las suites son las
      # dos de arriba; esto rompe cada regla y exige el rojo.
      - name: Contrapruebas del contrato de Tesorería
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs TC-

      # El turno operativo: se elige al abrir la caja (activo y del local, por
      # las tres rutas), la caja lo conserva con su fecha operativa y la base no
      # deja cambiarlos, Tesorería agrupa por el turno de la caja y no por la
      # hora, una verificación no mezcla turnos ni fechas y congela el suyo. Las
      # contrapruebas TO- rompen el código y el texto de la migración.
      - name: Turno operativo contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/turnoOperativo.mjs

      - name: Contrapruebas del turno operativo
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs TO-

      # La corrección histórica de caja: el ensayo en seco que escribe y deshace,
      # la aplicación con huella autorizada, la idempotencia y el fallo a mitad.
      # Se arma el incidente ×1000 con las rutas reales del circuito.
      - name: Ejercer la corrección histórica de caja contra PostgreSQL
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/correccionCaja.mjs

      - name: Contrapruebas de la corrección histórica de caja
        run: node --import ./scripts/alias-loader.mjs scripts/pruebas-db/contrapruebasRevision.mjs CH-

